kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: wingsmith
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "wingsmith.dev/role=dev"
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6553
