name: release

# A semver tag on main publishes that commit: the six images, multi-arch, at the tag's version and
# no other tag, each signed keylessly with cosign and carrying an SBOM and provenance attestation,
# and the chart at the same version. The wingsmith-host .deb and .rpm attach to the tag's GitHub
# release. Nothing here runs for a branch or a pull request.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HELM_VERSION: "v3.22.0"
  GO_VERSION: "1.26"

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      owner: ${{ steps.check.outputs.owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The tag reaches the shell through the environment, never spliced into the script.
      - id: check
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH[-PRERELEASE]; nothing is published"; exit 1
          fi
          version="${TAG#v}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main"; exit 1
          fi
          # appVersion is the image tag the chart defaults to, and only $version is published.
          for key in version appVersion; do
            chart="$(yq -r ".$key" libs/chart/cluster-setup/Chart.yaml)"
            if [ "$chart" != "$version" ]; then
              echo "::error::libs/chart/cluster-setup/Chart.yaml has $key $chart; set it to $version before tagging $TAG"; exit 1
            fi
          done
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "owner=${OWNER,,}" >>"$GITHUB_OUTPUT"

  # The whole CI suite against the tagged commit, so a tag cannot publish what main would refuse.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  images:
    name: image (${{ matrix.image }})
    needs: [version, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: plane
            context: libs
            file: libs/plane/Dockerfile
          - image: console
            context: libs/console
            file: libs/console/Dockerfile
          - image: operator
            context: libs
            file: libs/operator/Dockerfile
          - image: agent
            context: libs
            file: libs/agent/Dockerfile
          - image: gateway
            context: libs
            file: libs/gateway/Dockerfile
          - image: demo
            context: .
            file: dev/demo/Dockerfile
    env:
      IMAGE: ghcr.io/${{ needs.version.outputs.owner }}/${{ matrix.image }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No build cache: a release reads nothing an earlier, less trusted run could have written.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
      # Signing the index digest covers every platform and the SBOM and provenance it references.
      - name: sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  chart:
    needs: [version, ci, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHART_REPO: ghcr.io/${{ needs.version.outputs.owner }}/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3
      # Adds the dependencies' repositories, builds them in and packages, from a clean checkout so
      # nothing the working tree ignores can reach the archive.
      - name: package
        run: scripts/chart-package.sh "$VERSION" "$RUNNER_TEMP/chart"
      - name: push and sign
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/cluster-setup-$VERSION.tgz" "oci://$CHART_REPO" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest="$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/push.log")"
          if [ -z "$digest" ]; then
            echo "::error::helm push printed no digest to sign"; exit 1
          fi
          printf '%s' "$GH_TOKEN" | cosign login ghcr.io -u "$GH_ACTOR" --password-stdin
          cosign sign --yes "$CHART_REPO/cluster-setup@$digest"

  host-packages:
    name: host packages (${{ matrix.runner }})
    needs: [version, ci]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: libs/operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false
      - run: go mod download
      - run: deploy/host/build-packages.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-packages-${{ matrix.runner }}
          path: |
            libs/operator/dist/*.deb
            libs/operator/dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  # Attaches the .deb and .rpm (and their checksums) to the tag's GitHub release, creating it when
  # absent. No apt or rpm repository is published.
  host-release:
    needs: [version, host-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: host-packages-*
          merge-multiple: true
          path: packages
      - name: attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd packages
          sha256sum -- *.deb *.rpm >wingsmith-host-SHA256SUMS
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --verify-tag --title "$TAG" --notes "See CHANGELOG.md."
          fi
          gh release upload "$TAG" -R "$REPO" --clobber -- *.deb *.rpm wingsmith-host-SHA256SUMS
