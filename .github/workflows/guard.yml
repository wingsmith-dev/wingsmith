name: guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  leaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba detect --source /repo --redact --no-banner

      # Fork PRs get no secrets; the push to main after merge still runs this.
      - name: denylist
        env:
          DENYLIST: ${{ secrets.WINGSMITH_DENYLIST }}
        run: |
          if [ -z "$DENYLIST" ]; then
            echo "::notice::WINGSMITH_DENYLIST unavailable, skipping"
            exit 0
          fi
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist"
          WINGSMITH_DENYLIST="$RUNNER_TEMP/denylist" scripts/check-leaks.sh tree
          # Every line ever added, and every author and message, not just what HEAD holds.
          git log --all -p --format='%an%n%ae%n%B' | WINGSMITH_DENYLIST="$RUNNER_TEMP/denylist" scripts/check-leaks.sh message /dev/stdin
