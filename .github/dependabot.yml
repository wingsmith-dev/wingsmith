version: 2

# Weekly, with minor and patch bumps grouped per ecosystem so a week is one pull request per
# ecosystem rather than one per dependency. Majors and security updates still come one by one.
updates:
  - package-ecosystem: gomod
    directories:
      - /libs/agent
      - /libs/cli
      - /libs/gateway
      - /libs/operator
      - /libs/packages/tunnel
      - /libs/transit
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directories:
      - /libs/plane
      - /libs/conformance
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /libs/console
    schedule:
      interval: weekly
    groups:
      console:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /libs/agent
      - /libs/console
      - /libs/gateway
      - /libs/operator
      - /libs/plane
      - /libs/benchmarking/images/evalscope
      - /libs/benchmarking/images/vllm-bench
    schedule:
      interval: weekly
    groups:
      images:
        update-types: [minor, patch]

  - package-ecosystem: helm
    directory: /libs/chart/cluster-setup
    schedule:
      interval: weekly
