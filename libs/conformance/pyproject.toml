[project]
name = "hgrconform"
version = "0.1.0"
license = "Apache-2.0"
description = "Check an OpenAI-compatible endpoint against the wire spec, and against the endpoint it claims to be consistent with"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "jsonschema>=4.21"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

# Two dependencies and neither is a model SDK, by design. Half of what this asks
# about is the shape of the wire: whether a JSON object repeats a key, which chunk
# carries `usage`, what a 400 body says about who is really serving the request. An
# SDK normalises all three away before anything here could look at them.

[project.scripts]
hgrconform = "hgrconform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hgrconform"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Borrowed verbatim from libs/plane, so that a file moved between the two does not
# change shape on the way.
[tool.ruff.lint.isort]
force-single-line = true
from-first = false
force-sort-within-sections = false
length-sort = true
length-sort-straight = true
lines-after-imports = 2
lines-between-types = 1
known-first-party = ["hgrconform"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# The stub builds its ids with %-formatting intentionally; it is a test fixture, not house style.
[tool.ruff.lint.per-file-ignores]
"tests/stub.py" = ["UP031"]
