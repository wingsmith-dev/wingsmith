# A Wingsmith gateway, reached through a port-forward of its public listener on this
# machine, with a tenant API key. It needs no vendor key, so it is the profile to
# start from when checking your own deployment.
#
#   export WINGSMITH_API_KEY=<a tenant API key>
#   just conformance gateway
#   just conformance gateway --reference <a profile for the model's original provider>

name = "gateway"
base_url = "http://127.0.0.1:8080"
model = "gpt-oss-120b"
token_env = "WINGSMITH_API_KEY"

context_window = 131072
modalities = ["text"]
protocols = ["chat_completions"]

# What a caller must never see in an error body. These are the names of everything
# between the gateway and the engine. If any of them reaches a 4xx body, that is a
# finding today and it needs no reference endpoint to establish. Add the names your own
# infrastructure goes by here, and to the gateway's WINGSMITH_GATEWAY_REDACT_NAMES.
leak_needles = [
    "wingsmith",
    "dynamo",
    "vllm",
    "svc.cluster.local",
    "wingsmith-system",
    "ghcr.io",
]

# gpt-oss carries reasoning effort in the system prompt, not in a parameter. vLLM's
# own recipe for this model sets it with {"role": "system", "content": "Reasoning:
# high"} and documents no flag for it, so an endpoint sent `reasoning_effort` returns
# 200 and ignores it, which would record as conforming to a contract it never saw.
#   https://github.com/vllm-project/recipes/blob/main/models/openai/gpt-oss-20b.yaml
[thinking]
syntax = "system_prompt"
efforts = ["low", "medium", "high"]
prompt_template = "Reasoning: {effort}"
