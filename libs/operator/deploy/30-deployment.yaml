apiVersion: apps/v1
kind: Deployment
metadata:
  name: wingsmith-operator
  namespace: wingsmith-system
  labels:
    app.kubernetes.io/name: wingsmith-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wingsmith-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wingsmith-operator
    spec:
      serviceAccountName: wingsmith-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/wingsmith-dev/operator:REPLACE_WITH_IMAGE_TAG
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: wingsmith-operator
          env:
            - name: WINGSMITH_ENROLMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wingsmith-operator
                  key: enrolment-token
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            # An observation pass keeps only pods holding GPUs. A synthetic probe put its
            # peak heap near 30Mi at 128 nodes and near 220Mi at 1000 nodes with 7500 GPU
            # pods, so raise this limit past a few hundred GPU nodes.
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
