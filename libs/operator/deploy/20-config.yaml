# A development bundle for a local cluster talking to a plane on the host. Production clusters
# install the operator with the cluster-setup chart instead.
#
# The enrolment token is a credential and does not ship here. Issue one for this cluster from the
# plane, then create the Secret before applying this bundle:
#
#   kubectl create secret generic wingsmith-operator -n wingsmith-system \
#     --from-literal=enrolment-token=<token>
#
# 30-deployment.yaml reads it from this Secret's `enrolment-token` key. Without it, the Pod fails
# to start instead of dialling the hub with no credential.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wingsmith-operator
  namespace: wingsmith-system
data:
  WINGSMITH_CLUSTER_ID: dev-cluster
  # The plane's hub listens on 8001 (`just dev-up`). Plaintext ws:// carries the enrolment token
  # unencrypted, so the operator refuses it unless WINGSMITH_HUB_ALLOW_INSECURE is set; use wss://
  # anywhere but a local loop.
  WINGSMITH_HUB_URL: ws://host.docker.internal:8001/v1/hub/sync
  WINGSMITH_HUB_ALLOW_INSECURE: "true"
  WINGSMITH_LOG_LEVEL: info
  WINGSMITH_LOG_FORMAT: json
  WINGSMITH_NAMESPACE: wingsmith-system
  WINGSMITH_HEARTBEAT_INTERVAL: 10s
  WINGSMITH_LIVENESS_TIMEOUT: 30s
  WINGSMITH_SEND_QUEUE_SIZE: "1024"
  WINGSMITH_LEADER_ELECTION: "true"
  # Observe and report: no reconciler, and only the operations listed below. This is how a cluster
  # is first pointed at a plane. Set to "false" when the cluster should serve what the plane
  # declares; a managed cluster performs every operation kind.
  WINGSMITH_READ_ONLY: "true"
  # Operation kinds a read-only operator still performs, comma-separated: cordon, drain,
  # benchmark. Empty means none. Ignored once WINGSMITH_READ_ONLY is false.
  WINGSMITH_ALLOWED_OPERATIONS: ""
  # The node label that names a node's pool, the pool holding GPU nodes, and the pool (and its
  # taint) model-prefetch jobs run on.
  WINGSMITH_POOL_LABEL_KEY: wingsmith.dev/pool
  WINGSMITH_GPU_POOL_VALUE: gpu
  WINGSMITH_CACHE_POOL_VALUE: cache
  WINGSMITH_CACHE_TAINT_KEY: wingsmith.dev/cache
  # Registries or repositories engine, frontend and prefetch images must come from,
  # comma-separated. Empty allows any image the plane names.
  WINGSMITH_ALLOWED_IMAGE_PREFIXES: ""
  # The in-cluster DCGM exporter's metrics URL, scraped for device identity only (ADR 0007).
  # Empty disables the scrape; device ids then come from the wingsmith.dev/device-uuids annotation
  # or fall back to <node>-gpu<index>.
  WINGSMITH_DCGM_ENDPOINT: ""
  WINGSMITH_DCGM_TIMEOUT: 5s
  # Where a benchmark aims its load. Empty finds the Service that selects Dynamo's Frontend
  # component; set it only when the frontend is something Dynamo did not label.
  WINGSMITH_INFERENCE_ENDPOINT: ""
  WINGSMITH_BENCHMARK_TIMEOUT: 30m
  WINGSMITH_BENCHMARK_ARTIFACT_BASE: ""
  WINGSMITH_BENCHMARK_CPU: 500m
  WINGSMITH_BENCHMARK_MEMORY: 1Gi
