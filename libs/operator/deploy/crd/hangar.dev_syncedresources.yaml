---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: syncedresources.hangar.dev
spec:
  group: hangar.dev
  names:
    kind: SyncedResource
    listKind: SyncedResourceList
    plural: syncedresources
    shortNames:
    - syncres
    singular: syncedresource
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .spec.revision
      name: Revision
      type: integer
    - jsonPath: .status.observedRevision
      name: Observed
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SyncedResource is one declared object from the plane (a deployment, an artifact, a cache or a
          cluster component), held in the cluster so the operator keeps reconciling it through a
          control-plane outage.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SyncedResourceSpec is the durable local copy of one piece of desired state received from the
              hub. The payload is held as it arrived, not as typed fields: the wire schema evolves with
              the plane, and the CRD stays a faithful copy of what the plane said instead of this operator's
              reading of it.
            properties:
              adopt:
                description: |-
                  Adopt names a cluster object that already exists and is already running, promoted from a
                  discovered workload. It is provenance and a drift check: the reconciler takes ownership in
                  place instead of applying a rendered spec over it, and only while the live object still
                  digests to SpecFingerprint.

                  Both fields are on the durable copy, not read out of the payload each time, because
                  they are safety gates. A gate that depends on parsing the domain schema is a gate that
                  opens when the parse fails.
                properties:
                  kind:
                    type: string
                  name:
                    type: string
                  namespace:
                    description: Namespace, Kind and Name locate the object in this
                      cluster.
                    type: string
                  specFingerprint:
                    description: |-
                      SpecFingerprint is the digest of the pod template as it was when the plane accepted the
                      promotion. A reconciler that finds anything else must refuse and report, never converge:
                      closing that gap means restarting a model that nobody asked to have restarted.
                    type: string
                required:
                - kind
                - name
                - namespace
                - specFingerprint
                type: object
              authority:
                description: |-
                  Authority is who owns this object: "observed" or "managed". Observed means record and
                  verify and write nothing to the cluster; managed means render and converge. Empty reads as
                  observed, so an object from a plane that predates the field is never managed by accident.

                  This is the gate; the presence of Adopt is not, by design. Where an object came
                  from is a historical fact; whether this operator may act on it is a decision the plane
                  makes and can reverse (ADR 0009).
                enum:
                - observed
                - managed
                type: string
              kind:
                description: Kind is the domain object kind as named on the wire.
                minLength: 1
                type: string
              payload:
                description: Payload is the domain object exactly as it arrived on
                  the wire.
                x-kubernetes-preserve-unknown-fields: true
              revision:
                description: |-
                  Revision is the plane-assigned revision of this desired state. It is monotonic per object
                  and lets the reconciler ignore stale replays after a stream resume.
                format: int64
                minimum: 0
                type: integer
            required:
            - kind
            - revision
            type: object
          status:
            description: SyncedResourceStatus is the observed half, shipped back up
              the stream by the sync loop.
            properties:
              conditions:
                description: Conditions carries standard reconcile conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedRevision:
                description: ObservedRevision is the spec revision the reconciler
                  last acted on.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is a coarse reconcile outcome. It is not an operation: long-running, failable work
                  such as a drain or a benchmark travels as an operation frame and never lands here.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
