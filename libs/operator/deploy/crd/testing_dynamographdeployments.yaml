# A stand-in for NVIDIA's DynamoGraphDeployment, for tests that need a real API server.
#
# Deliberately permissive: the operator renders this object and never reads a field back
# except through the status the Dynamo operator writes, so a schema that validates our
# render is worth having and a schema that mirrors theirs is not. Vendoring their real CRD
# would tie this repository's tests to their release cadence for no added coverage.
#
# Not installed by the deployment manifests. It exists so `go test -tags e2e` can run the
# reconciler against a cluster that has no Dynamo operator in it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dynamographdeployments.nvidia.com
spec:
  group: nvidia.com
  names:
    kind: DynamoGraphDeployment
    listKind: DynamoGraphDeploymentList
    plural: dynamographdeployments
    singular: dynamographdeployment
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
