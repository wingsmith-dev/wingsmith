name = "agentic-multiturn"
description = """
Sequential multi-turn sessions over a large shared context: an agent that keeps a
conversation and re-reads its own history each turn. The defining property is that
almost all of each prompt was already seen, so the prefix cache -- not compute -- is
what the fleet runs out of first, and the working set is concurrent sessions times the
context at the LAST turn, not the mean input length.
"""

# Turns are sequential within a session, so the session count is a hard ceiling on
# achievable concurrency: N sessions can never put more than N requests in flight.
# Requests must be sessions x turns, or sessions are cut off before their context has
# grown and depth becomes a function of concurrency instead of of the workload.
checks = ["prefix_cache_capacity", "session_depth", "disaggregation", "slo"]
harness_extra = "--shared-system-prompt-length 4000 --user-context-prompt-length 24700"

[shape]
shared_prefix_tokens = 4000
session_context_tokens = 24700
new_tokens_per_turn = 1300
output_tokens = 256
turns = 25

[slo]
ttft_p90_seconds = 3.5
decode_tokens_per_second_per_user_p90 = 40.0
# A handful of failures in thousands is the network, not the deployment. Above this it
# is a defect and the run is void rather than merely worse.
max_error_fraction = 0.001

# Every family applies here: sessions share a growing prefix, so cache capacity binds;
# depth is load-bearing; the deployment disaggregates; and the traffic is sold against
# a latency target.

