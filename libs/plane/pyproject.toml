[project]
name = "hangar-plane"
version = "0.1.0"
license = "Apache-2.0"
description = "Hangar control plane — API, registry, placement, hub"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
  "litestar==2.14.0",
  "uvicorn==0.42.0",
  "websockets>=14.0",
  "sqlalchemy==2.0.48",
  "greenlet==3.2.4",
  "psycopg==3.3.3",
  "psycopg-pool==3.3.0",
  "alembic==1.18.4",
  "msgspec==0.20.0",
  "httpx==0.28.1",
  "sniffio==1.3.1",
  "click==8.1.8",
  "rich==13.9.4",
  "bcrypt==4.3.0",
  "pyyaml==6.0.3",
  "prometheus-client==0.21.1",
]

[project.scripts]
hangar-api = "app.api.__main__:main"
hangar-hub = "app.hub.__main__:main"
hangar-reactor = "app.reactor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==0.24.0",
  "pytest-cov==6.0.0",
  "ruff==0.16.3",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -v -m 'not database'"
markers = [
  "database: needs a live Postgres; deselected by default, run with `just test-db`",
]
# A deprecation raised from the plane's own code fails the run; third-party ones are reported.
filterwarnings = [
  'error::DeprecationWarning:app\..*',
  'error::PendingDeprecationWarning:app\..*',
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/*/__main__.py"]

[tool.coverage.report]
# Held against the full suite, database tests included, which CI runs with --cov and which measures
# 90%. The suite without Postgres measures about 76%, so `just cov` on a machine with no database fails.
fail_under = 88
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]

[tool.ruff]
exclude = ["migrations", "docs"]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]
ignore = [
  "E712", # SQLAlchemy column comparisons read `col == True`
  "E731",
]

[tool.ruff.lint.isort]
force-single-line = true
from-first = false
force-sort-within-sections = false
forced-separate = ["tests"]
known-first-party = ["app"]
known-third-party = ["litestar", "sqlalchemy"]
length-sort = true
length-sort-straight = true
lines-after-imports = 2
lines-between-types = 1
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
