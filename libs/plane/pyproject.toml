[project]
name = "hangar-plane"
version = "0.1.0"
description = "Hangar control plane — API, registry, placement, hub"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
  "litestar==2.14.0",
  "uvicorn==0.42.0",
  "websockets>=14.0",
  "sqlalchemy==2.0.48",
  "greenlet==3.2.4",
  "psycopg==3.3.3",
  "psycopg-pool==3.3.0",
  "alembic==1.18.4",
  "msgspec==0.20.0",
  "sniffio==1.3.1",
  "click==8.1.8",
  "rich==13.9.4",
  "bcrypt==4.3.0",
]

[project.scripts]
hangar-api = "app.api.__main__:main"
hangar-hub = "app.hub.__main__:main"
hangar-reactor = "app.reactor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==0.24.0",
  "pytest-cov==6.0.0",
  "ruff>=0.8.0",
  "mypy==1.19.1",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -v -m 'not database'"
markers = [
  "database: needs a live Postgres; deselected by default, run with `just test-db`",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.ruff]
exclude = ["migrations", "docs"]
line-length = 120

[tool.ruff.lint]
ignore = [
  "D100",
  "D104",
  "D107",
  "E712",
  "RUF012",
]

[tool.ruff.lint.isort]
force-single-line = true
from-first = false
force-sort-within-sections = false
forced-separate = ["tests"]
known-first-party = ["app"]
known-third-party = ["litestar", "sqlalchemy"]
length-sort = true
length-sort-straight = true
lines-after-imports = 2
lines-between-types = 1
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.pyright]
pythonVersion = "3.12"
include = ["app", "tests"]
exclude = ["migrations", ".venv"]

[tool.mypy]
python_version = "3.12"
strict = true
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
disallow_any_generics = false
disallow_untyped_defs = false
disallow_untyped_decorators = false
implicit_reexport = false
warn_return_any = false
exclude = ["migrations", "\\.venv"]
