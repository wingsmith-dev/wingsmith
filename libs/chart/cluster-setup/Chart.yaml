apiVersion: v2
name: cluster-setup
description: >-
  Turns a tier-1 cluster into one the hangar plane can manage: the dynamo
  namespace and model-weight cache, dcgm-exporter, the Dynamo platform (operator,
  NATS, the DynamoGraphDeployment CRD), and the hangar operator.
type: application

# One version for the chart and the images it runs: appVersion is the default
# tag for the operator and serving-agent images, and it always equals version.
# Bump both together, and record the change in CHANGELOG.md.
version: 0.3.0
appVersion: "0.3.0"

kubeVersion: ">=1.29.0-0"

keywords:
  - hangar
  - gpu
  - inference
  - dynamo

dependencies:
  # The exporter the operator scrapes for device identity; a hard dependency.
  - name: dcgm-exporter
    version: "4.8.3"
    repository: https://nvidia.github.io/dcgm-exporter/helm-charts
    condition: dcgm-exporter.enabled

  # Operator + NATS (the request/response and KV-event bus). The operator applies
  # the DynamoGraphDeployment CRD itself from its image (upgradeCRD, on by default),
  # so there is no separate CRD chart to vendor and the pull is anonymous.
  - name: dynamo-platform
    version: "1.4.1"
    repository: oci://nvcr.io/nvidia/ai-dynamo
    condition: dynamo-platform.enabled

home: https://github.com/hangar-dev/hangar
sources:
  - https://github.com/hangar-dev/hangar/tree/main/libs/chart/cluster-setup
annotations:
  artifacthub.io/license: Apache-2.0
