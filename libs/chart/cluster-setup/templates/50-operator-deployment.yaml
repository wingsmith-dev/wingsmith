apiVersion: apps/v1
kind: Deployment
metadata:
  name: hangar-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hangar-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hangar-operator
      annotations:
        # Roll the pod when the config changes, so a `helm upgrade` that only
        # touches the ConfigMap still restarts the operator.
        checksum/config: {{ include (print $.Template.BasePath "/40-operator-config.yaml") . | sha256sum }}
        # And when the token changes. `HANGAR_ENROLMENT_TOKEN` is a `secretKeyRef`,
        # resolved once when the pod starts, so rotating the token without this
        # leaves the operator holding an invalidated credential that fails on some
        # later reconnect, hours away from the `helm upgrade` that caused it.
        {{- with include "cluster-setup.enrolmentTokenRollKey" . }}
        rollout/enrolment-token: {{ . | quote }}
        {{- end }}
    spec:
      serviceAccountName: hangar-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "cluster-setup.operatorImage" . | quote }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: hangar-operator
          env:
            - name: HANGAR_ENROLMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.enrolmentToken.existingSecret }}
                  key: {{ .Values.enrolmentToken.secretKey }}
          ports:
            - name: health
              containerPort: 8081
            {{- if .Values.operator.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.operator.metrics.port }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          {{- if .Values.hub.caBundle }}
          volumeMounts:
            - name: hub-ca
              mountPath: /etc/hangar/hub-ca
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- if .Values.hub.caBundle }}
      volumes:
        - name: hub-ca
          configMap:
            name: hangar-hub-ca
      {{- end }}
      terminationGracePeriodSeconds: 30
{{- if and .Values.operator.metrics.enabled .Values.operator.metrics.podMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: hangar-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
    {{- with .Values.operator.metrics.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hangar-operator
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.operator.metrics.podMonitor.interval }}
{{- end }}
