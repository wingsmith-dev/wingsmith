apiVersion: v1
kind: ConfigMap
metadata:
  name: hangar-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
data:
  HANGAR_CLUSTER_ID: {{ .Values.cluster.id | quote }}
  HANGAR_HUB_URL: {{ .Values.cluster.hubUrl | quote }}
  HANGAR_LOG_LEVEL: {{ .Values.cluster.logLevel | quote }}
  HANGAR_LOG_FORMAT: {{ .Values.cluster.logFormat | quote }}
  HANGAR_NAMESPACE: {{ .Release.Namespace | quote }}
  HANGAR_WORKLOAD_NAMESPACE: "dynamo"
  HANGAR_LEADER_ELECTION: {{ .Values.operator.leaderElection | quote }}

  HANGAR_READ_ONLY: {{ .Values.cluster.readOnly | quote }}
  HANGAR_ALLOWED_OPERATIONS: {{ .Values.cluster.allowedOperations | quote }}

  HANGAR_POOL_LABEL_KEY: {{ required "pools.labelKey is required: name the label this cluster puts on its node pools. Left empty the operator falls back to its own default key and discovers no pools at all." .Values.pools.labelKey | quote }}
  HANGAR_GPU_POOL_VALUE: {{ required "pools.gpuValue is required: name the pool holding the GPU nodes." .Values.pools.gpuValue | quote }}
  HANGAR_CACHE_POOL_VALUE: {{ required "pools.cacheValue is required: name the pool model-prefetch jobs run on. It must be a pool that exists, or the jobs stay Pending." .Values.pools.cacheValue | quote }}
  {{- with .Values.pools.cacheTaintKey }}
  HANGAR_CACHE_TAINT_KEY: {{ . | quote }}
  {{- end }}

  HANGAR_MODEL_CACHE_PVC: {{ .Values.modelCache.pvcName | quote }}

  HANGAR_MULTINODE: {{ .Values.multinode.enabled | quote }}

  HANGAR_DCGM_ENDPOINT: {{ include "cluster-setup.dcgmEndpoint" . | quote }}
  {{- with (include "cluster-setup.dcgmSelector" .) }}
  HANGAR_DCGM_SELECTOR: {{ . | quote }}
  {{- end }}
  HANGAR_DCGM_TIMEOUT: {{ .Values.dcgm.timeout | quote }}
