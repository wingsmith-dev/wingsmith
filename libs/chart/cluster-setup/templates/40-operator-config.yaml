apiVersion: v1
kind: ConfigMap
metadata:
  name: hangar-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
data:
  HANGAR_CLUSTER_ID: {{ .Values.cluster.id | quote }}
  HANGAR_HUB_URL: {{ .Values.cluster.hubUrl | quote }}
  {{- if .Values.hub.allowInsecure }}
  HANGAR_HUB_ALLOW_INSECURE: "true"
  {{- end }}
  {{- if .Values.hub.caBundle }}
  HANGAR_HUB_CA_FILE: /etc/hangar/hub-ca/ca.crt
  {{- end }}
  HANGAR_LOG_LEVEL: {{ .Values.cluster.logLevel | quote }}
  HANGAR_LOG_FORMAT: {{ .Values.cluster.logFormat | quote }}
  HANGAR_NAMESPACE: {{ .Release.Namespace | quote }}
  HANGAR_WORKLOAD_NAMESPACE: {{ include "cluster-setup.workloadNamespace" . | quote }}
  HANGAR_LEADER_ELECTION: {{ .Values.operator.leaderElection | quote }}
  # "0" is the operator's own off switch.
  HANGAR_METRICS_ADDR: {{ ternary (printf ":%v" .Values.operator.metrics.port) "0" .Values.operator.metrics.enabled | quote }}

  HANGAR_READ_ONLY: {{ .Values.cluster.readOnly | quote }}
  HANGAR_ALLOWED_OPERATIONS: {{ include "cluster-setup.allowedOperations" . | quote }}

  HANGAR_POOL_LABEL_KEY: {{ required "pools.labelKey is required: name the label this cluster puts on its node pools. Left empty the operator falls back to its own default key and discovers no pools at all." .Values.pools.labelKey | quote }}
  HANGAR_GPU_POOL_VALUE: {{ required "pools.gpuValue is required: name the pool holding the GPU nodes." .Values.pools.gpuValue | quote }}
  HANGAR_CACHE_POOL_VALUE: {{ required "pools.cacheValue is required: name the pool model-prefetch jobs run on. It must be a pool that exists, or the jobs stay Pending." .Values.pools.cacheValue | quote }}
  {{- with .Values.pools.cacheTaintKey }}
  HANGAR_CACHE_TAINT_KEY: {{ . | quote }}
  {{- end }}

  HANGAR_MODEL_CACHE_PVC: {{ .Values.modelCache.pvcName | quote }}
  {{- with .Values.modelCache.localDir }}
  HANGAR_LOCAL_MODEL_CACHE_DIR: {{ . | quote }}
  {{- end }}

  HANGAR_MULTINODE: {{ .Values.multinode.enabled | quote }}

  HANGAR_EFA_DEVICES: {{ .Values.fabric.devices | quote }}
  {{- with .Values.fabric.resource }}
  HANGAR_FABRIC_RESOURCE: {{ . | quote }}
  {{- end }}
  {{- with .Values.fabric.nixlBackends }}
  HANGAR_NIXL_BACKENDS: {{ join "," . | quote }}
  {{- end }}

  {{- with .Values.operator.engine.imagePullSecrets }}
  HANGAR_ENGINE_PULL_SECRETS: {{ join "," . | quote }}
  {{- end }}

  # One frontend per model, rendered by the operator into each model's own graph.
  # True only under `frontend.mode: per-model`, which is the default; `shared`
  # hands the job to 85-frontend.yaml and `none` to nobody. See frontend.perModel
  # in values.yaml for what this changes cluster-wide.
  #
  # The keys below are read whatever the mode says, and cost nothing when the
  # operator is not rendering frontends — it is the flag above that decides.
  HANGAR_FRONTEND_ENABLED: {{ eq .Values.frontend.mode "per-model" | quote }}
  HANGAR_FRONTEND_REPLICAS: {{ .Values.frontend.replicas | quote }}
  HANGAR_FRONTEND_ANTHROPIC_API: {{ .Values.frontend.anthropicApi.enabled | quote }}
  HANGAR_FRONTEND_ANTHROPIC_STRIP_PREAMBLE: {{ .Values.frontend.anthropicApi.stripClaudeCodePreamble | quote }}
  HANGAR_FRONTEND_GLOBAL_DYNAMO_NAMESPACE: {{ .Values.frontend.perModel.globalDynamoNamespace | quote }}
  {{- with .Values.frontend.perModel.image }}
  HANGAR_FRONTEND_IMAGE: {{ . | quote }}
  {{- end }}
  {{- with .Values.frontend.imagePullSecrets }}
  HANGAR_FRONTEND_PULL_SECRETS: {{ join "," . | quote }}
  {{- end }}
  {{- with .Values.frontend.perModel.resources.requests.cpu }}
  HANGAR_FRONTEND_CPU: {{ . | quote }}
  {{- end }}
  {{- with .Values.frontend.perModel.resources.requests.memory }}
  HANGAR_FRONTEND_MEMORY: {{ . | quote }}
  {{- end }}
  {{- with .Values.frontend.perModel.resources.limits.memory }}
  HANGAR_FRONTEND_MEMORY_LIMIT: {{ . | quote }}
  {{- end }}

  HANGAR_DCGM_ENDPOINT: {{ include "cluster-setup.dcgmEndpoint" . | quote }}
  {{- with (include "cluster-setup.dcgmSelector" .) }}
  HANGAR_DCGM_SELECTOR: {{ . | quote }}
  {{- end }}
  HANGAR_DCGM_TIMEOUT: {{ .Values.dcgm.timeout | quote }}
{{- with .Values.hub.caBundle }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hangar-hub-ca
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "cluster-setup.labels" $ | nindent 4 }}
data:
  ca.crt: {{ . | quote }}
{{- end }}
