{{- if .Values.enrolmentToken.value }}
# Only when a value is supplied — the normal path, the register screen mints it.
# `existing` is the opt-out, for a Secret created out of band.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.enrolmentToken.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.enrolmentToken.secretKey }}: {{ .Values.enrolmentToken.value | quote }}
{{- end }}
{{- if .Values.hfToken.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.hfToken.secretName }}
  namespace: {{ include "cluster-setup.workloadNamespace" . }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
type: Opaque
stringData:
  HF_TOKEN: {{ required "hfToken.value is required when hfToken.create is true: an empty token creates a Secret that looks configured and fails on the first gated model pull. Set hfToken.create=false if this cluster pulls no gated weights." .Values.hfToken.value | quote }}
{{- end }}
{{- if .Values.imagePullSecret.create }}
---
# The registry credential for the operator and agent images, referenced by their
# ServiceAccounts. `auth` and no `username`/`password` fields: the kubelet reads
# either, and one base64 pair is one place for the credential to be rather than
# two copies that can disagree.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf `{"auths":{"%s":{"auth":"%s"}}}` .Values.imagePullSecret.registry (printf "%s:%s" .Values.imagePullSecret.username .Values.imagePullSecret.token | b64enc) | b64enc }}
{{- if or .Values.frontend.imagePullSecrets .Values.operator.engine.imagePullSecrets }}
---
# The same credential again, in the workload namespace. A pull Secret is namespaced and the
# kubelet only reads one from the pod's own namespace, so the copy above cannot
# serve the frontend: it is in the release namespace and the frontend is not.
#
# Rendered only when a frontend or engine actually names a pull Secret, which it
# does only when its image is private. A cluster using only anonymous images gets
# no second copy of a credential it has no use for.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecret.name }}
  namespace: {{ include "cluster-setup.workloadNamespace" . }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf `{"auths":{"%s":{"auth":"%s"}}}` .Values.imagePullSecret.registry (printf "%s:%s" .Values.imagePullSecret.username .Values.imagePullSecret.token | b64enc) | b64enc }}
{{- end }}
{{- end }}
{{- if and .Values.monitoring.enabled (not .Values.monitoring.remoteWrite.basicAuth.useEnrolmentToken) (not .Values.monitoring.remoteWrite.basicAuth.existing) (not .Values.monitoring.remoteWrite.bearerToken.existingSecret) }}
---
# A separate credential for the metrics agent, only for a store that is not
# hangar's — under the default `useEnrolmentToken` the agent mounts the enrolment
# Secret above instead and this object does not exist. Mounted as files rather
# than env vars so the agent reads it through `username_file`/`password_file` and
# the scrape-config ConfigMap — which is world-readable to anything with `get
# configmaps` — holds no secret at all.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.monitoring.remoteWrite.basicAuth.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.monitoring.remoteWrite.basicAuth.usernameKey }}: {{ .Values.monitoring.remoteWrite.basicAuth.username | quote }}
  {{ .Values.monitoring.remoteWrite.basicAuth.passwordKey }}: {{ .Values.monitoring.remoteWrite.basicAuth.password | quote }}
{{- end }}
