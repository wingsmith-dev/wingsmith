{{- if .Values.enrolmentToken.value }}
# Only when a value is supplied (dev clusters); in production the fleet secret is
# created out of band and referenced by name.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.enrolmentToken.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.enrolmentToken.secretKey }}: {{ .Values.enrolmentToken.value | quote }}
{{- end }}
{{- if .Values.hfToken.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.hfToken.secretName }}
  namespace: dynamo
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
type: Opaque
stringData:
  HF_TOKEN: {{ .Values.hfToken.value | quote }}
{{- end }}
