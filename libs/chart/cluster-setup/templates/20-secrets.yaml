{{- if and (not .Values.enrolmentToken.value) (not .Values.enrolmentToken.existing) }}
{{- fail "enrolmentToken.value is required: mint the cluster's token on the register screen and install from the values.yaml it renders. The operator Deployment reads the token from a Secret this chart creates, so without it the pod starts into CreateContainerConfigError. Set enrolmentToken.existing=true only if you created that Secret yourself." }}
{{- end }}
{{- if .Values.enrolmentToken.value }}
# Only when a value is supplied — the normal path, the register screen mints it.
# `existing` is the opt-out, for a Secret created out of band.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.enrolmentToken.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.enrolmentToken.secretKey }}: {{ .Values.enrolmentToken.value | quote }}
{{- end }}
{{- if .Values.hfToken.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.hfToken.secretName }}
  namespace: dynamo
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
type: Opaque
stringData:
  HF_TOKEN: {{ required "hfToken.value is required when hfToken.create is true: an empty token creates a Secret that looks configured and fails on the first gated model pull. Set hfToken.create=false if this cluster pulls no gated weights." .Values.hfToken.value | quote }}
{{- end }}
{{- if and .Values.monitoring.enabled (not .Values.monitoring.remoteWrite.basicAuth.existing) }}
---
# The credential the metrics agent presents to the central store's write ingress.
# Mounted as files rather than env vars so the agent reads it through
# `username_file`/`password_file` and the scrape-config ConfigMap — which is
# world-readable to anything with `get configmaps` — holds no secret at all.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.monitoring.remoteWrite.basicAuth.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.monitoring.remoteWrite.basicAuth.usernameKey }}: {{ .Values.monitoring.remoteWrite.basicAuth.username | quote }}
  {{ .Values.monitoring.remoteWrite.basicAuth.passwordKey }}: {{ .Values.monitoring.remoteWrite.basicAuth.password | quote }}
{{- end }}
