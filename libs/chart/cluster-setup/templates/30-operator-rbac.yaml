apiVersion: v1
kind: ServiceAccount
metadata:
  name: hangar-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
{{- with .Values.imagePullSecret.name }}
# On the ServiceAccount and not the pod spec, so every pod that runs as it inherits
# the credential and adding one later is not an edit to a Deployment.
imagePullSecrets:
  - name: {{ . }}
{{- end }}
---
# Kept in step with libs/operator/deploy/rbac/role.yaml; read-only is behavioural,
# not a permission switch, so the role is the same either way.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hangar-operator
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [batch]
    resources: [jobs/status]
    verbs: [get]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, get, list, patch, update, watch]
  - apiGroups: [nvidia.com]
    resources: [dynamographdeployments]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [nvidia.com]
    resources: [dynamographdeployments/status]
    verbs: [get]
  - apiGroups: [placeholder.hangar.dev]
    resources: [syncedresources]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [placeholder.hangar.dev]
    resources: [syncedresources/status]
    verbs: [get, patch, update]
  - apiGroups: [sync.hangar.dev]
    resources: [streamcheckpoints]
    verbs: [create, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hangar-operator
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hangar-operator
subjects:
  - kind: ServiceAccount
    name: hangar-operator
    namespace: {{ .Release.Namespace }}
