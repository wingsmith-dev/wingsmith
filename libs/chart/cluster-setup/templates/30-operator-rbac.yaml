{{- $workloads := include "cluster-setup.workloadNamespace" . -}}
{{- $ops := splitList "," (include "cluster-setup.operations" .) -}}
{{- $reconcile := not .Values.cluster.readOnly -}}
{{- $cordon := or (has "cordon" $ops) (has "drain" $ops) -}}
{{- $drain := has "drain" $ops -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wingsmith-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
{{- with .Values.imagePullSecret.name }}
# On the ServiceAccount and not the pod spec, so every pod that runs as it inherits
# the credential and adding one later is not an edit to a Deployment.
imagePullSecrets:
  - name: {{ . }}
{{- end }}
---
# The operator's permissions, granted by scope and by what this cluster lets it
# do. libs/operator/deploy/rbac/role.yaml is the union of everything the binary
# can do, generated from its markers; this chart grants only the part a given
# install needs:
#
#   always                     read nodes, pods, deployments and statefulsets
#                              cluster-wide (observation), write its own
#                              state in the release namespace, and read that
#                              state in the workload namespace (see below);
#   readOnly: false            write DynamoGraphDeployments and prefetch Jobs in
#                              the workload namespace (reconciliation);
#   benchmark                  create benchmark Jobs, read their logs and find
#                              the frontend Service, in the workload namespace;
#   cordon or drain            patch nodes cluster-wide;
#   drain                      evict pods cluster-wide.
#
# The last three follow `cluster.allowedOperations` on a read-only cluster and
# are all on otherwise, because a managed cluster's operator performs every
# operation the plane sends. A read-only cluster with no operations allowed gets
# no write access to anything outside the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wingsmith-operator
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wingsmith-operator
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wingsmith-operator
subjects:
  - kind: ServiceAccount
    name: wingsmith-operator
    namespace: {{ .Release.Namespace }}
---
{{- /*
The operator's manager caches both the release namespace and the workload
namespace (libs/operator/internal/reconcile/manager.go), and controller-runtime
opens an informer for every cached type in every one of them. So each type it
reads through that cache needs get/list/watch in both namespaces, even where it
only ever writes in one: the SyncedResource store reads through it read-only or
not, and a managed operator also watches Jobs and DynamoGraphDeployments. A
missing list in either namespace leaves the cache unsynced and the manager
exits.
*/}}
{{- if eq $workloads .Release.Namespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wingsmith-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
rules:
  {{- include "cluster-setup.operatorStateRules" . | nindent 2 }}
  {{- with include "cluster-setup.operatorWorkloadRules" . | trim }}{{ . | nindent 2 }}{{ end }}
---
{{- include "cluster-setup.operatorRoleBinding" (list . .Release.Namespace) }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wingsmith-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
rules:
  {{- include "cluster-setup.operatorStateRules" . | nindent 2 }}
  {{- if $reconcile }}
  # Read only, for the cache's informers in this namespace.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [nvidia.com]
    resources: [dynamographdeployments]
    verbs: [get, list, watch]
  {{- end }}
---
{{- include "cluster-setup.operatorRoleBinding" (list . .Release.Namespace) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wingsmith-operator
  namespace: {{ $workloads }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
rules:
  # Read only, for the cache's informers in this namespace.
  - apiGroups: [wingsmith.dev]
    resources: [syncedresources]
    verbs: [get, list, watch]
  {{- with include "cluster-setup.operatorWorkloadRules" . | trim }}{{ . | nindent 2 }}{{ end }}
---
{{- include "cluster-setup.operatorRoleBinding" (list . $workloads) }}
{{- end }}
{{- if $cordon }}
---
# Cordon and drain act on whichever node the plane names, and a drain evicts
# every accelerator pod on it in whatever namespace it runs, so neither can be
# namespaced.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wingsmith-operator-nodes
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [patch, update]
  {{- if $drain }}
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wingsmith-operator-nodes
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wingsmith-operator-nodes
subjects:
  - kind: ServiceAccount
    name: wingsmith-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
