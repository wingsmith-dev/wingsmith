{{- if .Values.modelCache.create }}
# The shared model-weight cache the operator mounts by name. ReadWriteMany,
# because disaggregated prefill and decode workers mount it together.
#
# Kept on `helm uninstall`, like the namespace it is in: it holds downloaded
# weights that take hours to fetch again, and a reinstall picks it back up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.modelCache.pvcName }}
  namespace: {{ include "cluster-setup.workloadNamespace" . }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.modelCache.accessMode }}
  storageClassName: {{ required "modelCache.storageClass is required: name a ReadWriteMany class (e.g. an EFS-backed one). Left empty the PVC falls to the cluster's default class, which is usually ReadWriteOnce, and it stays Pending on ProvisioningFailed." .Values.modelCache.storageClass }}
  resources:
    requests:
      storage: {{ .Values.modelCache.size }}
{{- end }}
