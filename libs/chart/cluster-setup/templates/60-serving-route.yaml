{{- if .Values.serving.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wingsmith-serving
  namespace: {{ .Values.serving.backend.namespace | default (include "cluster-setup.workloadNamespace" .) }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
spec:
  secretName: wingsmith-serving-tls
  dnsNames:
    - {{ .Values.serving.host | quote }}
  issuerRef:
    name: {{ .Values.serving.clusterIssuer }}
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wingsmith-serving
  namespace: {{ .Values.serving.backend.namespace | default (include "cluster-setup.workloadNamespace" .) }}
  labels:
    {{- include "cluster-setup.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.serving.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ .Values.serving.host }}`)
      kind: Rule
      {{- with .Values.serving.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ .Values.serving.backend.service }}
          port: {{ .Values.serving.backend.port }}
  tls:
    secretName: wingsmith-serving-tls
{{- end }}
