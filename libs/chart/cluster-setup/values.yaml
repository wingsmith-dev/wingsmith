# cluster-setup — everything a cluster installs to become one the plane can manage.
#
# This file is a form. Each value says what to put and what breaks if it is wrong;
# the reasoning behind a component lives in its template's header, and the
# reasoning behind a decision lives in docs/decisions. What is left here is only
# what differs per cluster.

# ── Identity ──────────────────────────────────────────────────────────────────

cluster:
  # Must match the name of a cluster already declared in the plane.
  id: ""
  # The plane's hub endpoint the operator dials, ws:// or wss://.
  hubUrl: ""
  # e.g. ap-south-1. Stamped on every series as the `region` external label, so a
  # cluster that omits it is the one blank cell in a fleet-wide breakdown.
  # Required with `monitoring.enabled`, ignored otherwise.
  region: ""
  readOnly: true
  allowedOperations: benchmark
  logLevel: info
  logFormat: json

# This cluster's enrolment token: its identity to the plane, minted for this
# cluster alone, on the register screen or with
# `POST /v1/clusters/{ref}/enrolment-token`. It is shown once; the register
# screen renders it here as `value`, and the chart creates the Secret from it.
# The plane has no fleet-wide token a cluster could use instead: the hub refuses
# any session that is not opened with the token minted for that cluster.
#
# It is mounted only in the pods that present it, and each is checked by the
# plane against what it stored when it minted the token:
#   - the operator, to the hub (`cluster.hubUrl`);
#   - the serving agent, to the gateway on the tunnel, when `agent.enabled`;
#   - the metrics agent, as the remote-write basic-auth password, when
#     `monitoring.enabled` with `basicAuth.useEnrolmentToken` (ADR 0012).
# Re-minting it on the register screen invalidates the old one everywhere at
# once; install the new values and the pods that hold it restart.
enrolmentToken:
  existingSecret: hangar-operator
  secretKey: enrolment-token
  value: ""
  # Opt-out for a hand-driven install where you created `existingSecret` yourself.
  existing: false

# Registry credential for the operator, agent, and any private workload runtime
# a cluster opts into below. `name` empty means no pull secret is referenced at
# all, which is right when those images are public or sit in a registry the nodes
# already authenticate to. Set `name` to reference one, and `create` to have the
# chart build it from `username` and `token` — a GHCR token needs only
# `read:packages`.
#
# Not applied to the metrics agent or the subcharts: they pull from quay.io,
# nvcr.io and Docker Hub, and the subcharts carry their own pull-secret values.
imagePullSecret:
  create: false
  name: ""
  registry: ghcr.io
  username: ""
  token: ""

# ── What this cluster's hardware looks like ───────────────────────────────────

# All three are required. The operator's own default label key is not the one any
# cluster here uses, so an empty value discovers no pools rather than falling back
# usefully, and a `cacheValue` naming a pool that does not exist leaves prefetch
# jobs Pending.
pools:
  labelKey: ""
  gpuValue: ""
  cacheValue: ""
  cacheTaintKey: ""

# Where the operator renders models, and where the model cache and the
# frontends live. Created by the chart and kept on `helm uninstall`, because
# deleting it deletes every model on the cluster; set `create: false` to use a
# namespace you manage yourself.
#
# `podSecurity` becomes the namespace's Pod Security Admission labels. Warn and
# audit only: an engine on a fabric-attached pool can need capabilities the
# baseline profile refuses, so enforcing is a per-cluster decision.
workloadNamespace:
  name: dynamo
  create: true
  podSecurity:
    warn: baseline
    audit: baseline

modelCache:
  create: true
  pvcName: model-cache
  # Required, and must be ReadWriteMany — a cluster's default class is usually RWO
  # and breaks the shared mount. e.g. an EFS-backed class.
  storageClass: ""
  accessMode: ReadWriteMany
  size: 500Gi
  # A directory on the node's own disk to mirror weights into before serving them, or
  # empty to read them from the shared volume as before.
  #
  # The shared volume is where weights are kept; it is a poor place to load them from.
  # Measured on a p6-b300.48xlarge reading Kimi-K3 over EFS: 1.47 GB/s per node, half of
  # each NFS read's latency spent queued on the client. Four nodes loading together cost
  # 19% over one alone, so the ceiling is per-client rather than the filesystem's, and
  # 1.4 TB against it is ~16 minutes of a GPU node doing nothing.
  #
  # Set it only where the nodes have a disk that can hold a model. The instance store on
  # a GPU node usually can and its root volume usually cannot; on a node with neither,
  # the copy is skipped and the engine reads the shared cache exactly as before, so a
  # wrong answer here costs a slow start and never a failed one.
  #
  # The mirror outlives the pod and is wiped with the node, which on spot capacity means
  # a reclaimed node pays the copy once more. That is the same copy it would have paid
  # reading over NFS, moved earlier.
  localDir: ""

# An override, not the switch. Leave it off.
#
# Whether this cluster can run a replica whose devices do not fit on one machine is
# discovered, not declared: the operator reads the API groups it is served and
# reports a leader-worker backend — Grove or LeaderWorkerSet — if one is there. So
# the way to turn multi-node on is `dynamo-platform.global.grove.install`, and the
# capability follows on the next observation tick with nothing set here.
# `dynamo-platform.global.grove.enabled` is the other half of that pair and turns
# on the integration only, for a cluster where Grove was installed by something
# other than this chart.
#
# This exists because detection matches on group name. A backend serving a group
# nobody anticipated would read as absent, and this asserts it by hand until the
# match is fixed. It can only widen: a cluster the operator can see a backend in is
# capable whatever this says, because a stale `false` that disabled a working
# cluster would be the same class of bug this replaced.
#
# Setting it true on a cluster with no backend is the one way left to get the old
# failure — the CRD accepts the field and produces a single pod holding a fraction
# of the devices the engine was told to expect, which starts and then hangs in
# collective initialisation with nothing saying why. Without it, a deployment
# needing more than one node waits with `MultinodeNotEnabled` and names the backend
# to install.
multinode:
  enabled: false

# The high-speed fabric a worker pod asks for, so that NIXL can move the KV cache
# over RDMA instead of falling back to TCP on the pod network.
#
# `devices: 0` asks for nothing, which is what every cluster did before this
# existed, and is correct for any pool without the interfaces. It is not a
# cosmetic default: with no request the device plugin mounts no /dev/infiniband,
# UCX finds no RDMA transport, and prefill/decode disaggregation ships the whole
# KV cache of every request over TCP. On Kimi K3 at 38k input tokens that is
# ~1.8GB per request, measured at ~300MB/s and 6.1s per transfer. Aggregated
# serving never crosses a node for KV, so it is unaffected -- which is what makes
# the mistake look like a verdict on disaggregation rather than on the pod spec.
#
# `resource` is the extended-resource name, which belongs to whoever supplies the
# compute rather than to the fabric. Empty means the AWS EFA device plugin's name,
# which is what our EC2 pools advertise. A bare-metal or non-EC2 pool runs a
# different plugin -- `rdma/hca`, `rdma/ib`, a vendor name -- and carries a
# different number of interfaces per chassis. Read both off the node:
#   kubectl get node <n> -o jsonpath='{.status.allocatable}'
# Asking for a name no node advertises leaves the pod Pending with no other
# symptom, so a wrong value here reads as a scheduling problem.
fabric:
  devices: 0
  resource: ""
  # NIXL plugins the KV connector registers. Empty leaves vLLM's default of UCX.
  #
  # On EC2 this must be LIBFABRIC. EFA is a libfabric provider; NIXL ships
  # libplugin_UCX.so and libplugin_LIBFABRIC.so side by side and defaults to the
  # wrong one. Measured here with all 16 interfaces mounted and UCX still
  # selected: 5.6-5.9s per transfer, ~39MB/s, the same as before the devices
  # existed. NVIDIA's EFA guide calls this "a silent-failure path -- getting it
  # wrong manifests as ~100s TTFT", which is exactly what we saw and spent a
  # night attributing to the topology.
  #
  # The runtime image must also carry libfabric itself. NVIDIA's published image
  # ships the plugin but not the library (`libfabric.so.1 => not found`), and the
  # EKS host's EFA install is the minimal profile with no libfabric either. Ours
  # is appended registry-side; see hangar-runtime/frontend.
  nixlBackends: []

dcgm:
  # Empty derives both from the bundled dcgm-exporter. Set them to point at an
  # exporter this chart does not install.
  endpoint: ""
  # How the operator finds the exporter pods behind that Service, so it scrapes
  # every node rather than whichever one the ClusterIP picks.
  selector: ""
  timeout: 5s

# ── What this chart runs ──────────────────────────────────────────────────────

operator:
  image:
    repository: ghcr.io/hangar-dev/operator
    tag: ""
    pullPolicy: Always
  leaderElection: true
  engine:
    # Secrets in the workload namespace presented when pulling a workload's `engine_runtime_image`.
    # Empty for the NVIDIA runtime images, which are anonymous; set this when a
    # model needs a private build such as the GLM 5.3 runtime in GHCR.
    imagePullSecrets: []
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

# This cluster's end of the inference tunnel: dials out to the gateway, proxies
# each request to the local Dynamo frontend. Off by default — the gateway address
# has no safe default, and an agent without one dials nothing.
# Why it is its own Deployment and not a sidecar: templates/80-agent.yaml.
agent:
  enabled: false
  # Two, so a `helm upgrade` does not take this cluster's inference with it.
  replicas: 2
  image:
    repository: ghcr.io/hangar-dev/agent
    tag: ""
    pullPolicy: Always
  gateway:
    # The gateway's tunnel address as `host:port` — TLS assumed, no scheme. One
    # address however many replicas the gateway runs: the agent learns the rest
    # from the handshake, so scaling it never edits this file.
    # e.g. hangar.example.com:443
    address: ""
  # `host:port` or a URL. Empty discovers the Service carrying Dynamo's frontend
  # labels; set it only if this cluster fronts its models with something else.
  frontendEndpoint: ""
  # How long the local frontend may hold a request without sending a response
  # header, as a Go duration. Empty takes the agent's own default, which is the
  # same number the gateway defaults to.
  #
  # A non-streamed completion sends no header until its last token, so on that
  # shape this bounds the whole generation. Every hop on the path — the gateway,
  # the tunnel, this agent — arms the same timer and only the smallest of them is
  # ever observed, so raising this alone does nothing: a cluster that needs longer
  # than the default needs HANGAR_RESPONSE_HEADER_TIMEOUT raised on the gateway in
  # the plane's own infra/ too, and the same value in both places.
  responseHeaderTimeout: ""
  # A proxy, not a runtime: it copies bytes and holds streams open. No CPU limit,
  # because throttling the data path is latency on every token.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# The OpenAI-compatible frontend a request actually lands on, and how many of
# them a cluster runs.
#
# `mode` is the one switch, because the two topologies are alternatives and not
# options that compose: a cluster that renders a frontend per model has no use
# for a shared one, and running both leaves a second way in that nothing routes
# to. Earlier versions of this chart spelled the choice as two booleans in two
# blocks — `frontend.enabled` here and `operator.frontend.enabled` under the
# operator — which could be set to contradict each other, and defaulted to the
# topology ADR 0013 replaced.
#
#   per-model  the operator renders a Frontend into each model's own graph, on
#              that model's own image. A frontier model's runtime stops being a
#              fleet-wide lowest common denominator, which is the whole point:
#              on 2026-09-01 one cluster frontend failed registration on Kimi
#              K3's tokenizer and `GET /v1/models` returned an empty list — not
#              K3's entry, the list. See docs/decisions/0013-*.md.
#
#   shared     one frontend for the cluster, every model served through it and
#              discovered over `globalDynamoNamespace`. What this chart did
#              before ADR 0013 and what a cluster still falls back to.
#
#   none       no frontend from this chart. For the first install of a brand-new
#              cluster, and for a frontend somebody else installed — pair it with
#              `agent.frontendEndpoint`.
#
# The first install of a NEW cluster must use `none`, in either topology. A
# frontend is a DynamoGraphDeployment, and that CRD is applied by the Dynamo
# operator at runtime rather than shipped in this chart's `crds/`, so a fresh
# install that renders one fails the release with "no matches for kind
# DynamoGraphDeployment". The sequence:
#
#   1. install with `--set frontend.mode=none --set agent.enabled=false` — the
#      control path only. The operator enrols and the cluster goes `active`.
#   2. upgrade, taking the default below — the data path, once the Dynamo
#      operator from step 1 has registered its own types.
#
# Changing `mode` on a cluster that is already running models is NOT a
# configuration change. Dynamo holds a graph's component set immutable after
# creation, so every existing graph has to be deleted and rendered again, and
# every model reloads its weights when it is.
frontend:
  # per-model | shared | none
  mode: per-model

  # ── both modes ──────────────────────────────────────────────────────────

  # Two, so a rollout does not take a model's only way in with it. A frontend
  # holds no model state — the workers do — so a replica is cheap and stateless.
  replicas: 2

  # Secrets in the workload namespace the kubelet presents when pulling a
  # frontend image. Empty for the NVIDIA runtime, which nvcr.io serves
  # anonymously.
  #
  # It exists because a frontend image is not always NVIDIA's. Both bugs that
  # made Kimi K3 unusable -- tool-call ids reused across turns, and extended
  # thinking forced on through `/v1/messages` -- are in the frontend binary, so
  # the fix is a patched runtime and the fix ships as an image.
  # `hangar-runtime/frontend/` builds it and it lands in a private GHCR repository,
  # which needs a credential where nvcr.io needs none.
  #
  # Naming one here is also what renders the credential into the workload
  # namespace at all: a
  # pull Secret is namespaced, and the copy the operator and agent use is in the
  # release namespace, where no frontend pod can read it.
  imagePullSecrets: []

  # The Anthropic Messages API (`/v1/messages`), which the frontend serves
  # natively and leaves off by default. On, because a cluster that serves an
  # OpenAI surface and not this one cannot be used by Anthropic-protocol clients
  # at all — Claude Code among them — and the alternative is a translating proxy
  # per client, which puts a second implementation of the wire on somebody's
  # laptop.
  #
  # NVIDIA marks it experimental. It is additive: a route that did not exist
  # before, reached only by callers that ask for it, so turning it on cannot
  # change what an OpenAI-compatible caller already gets.
  anthropicApi:
    enabled: true
    # Drops the Claude Code billing preamble from the system prompt. Dynamo's own
    # flag, and its own reasoning: fewer tokens, and a prompt that starts the same
    # way every time is a prompt the prefix cache can actually hit.
    stripClaudeCodePreamble: true

  # ── mode: per-model ─────────────────────────────────────────────────────
  #
  # Read by the operator, through 40-operator-config.yaml. Ignored in the other
  # two modes.
  perModel:
    # The image a model's frontend runs when its deployment declares no
    # `frontend_image`. Empty falls back to the deployment's engine runtime
    # image, which is right for the ordinary case: the Dynamo runtime image
    # carries the frontend and the engine together.
    image: ""
    # Whether each rendered frontend watches every Dynamo namespace on the
    # cluster or only its own graph's. True is today's behaviour and the only one
    # that currently works: the workers are pinned to the global namespace, so a
    # frontend narrowed to its own graph discovers nothing at all.
    #
    # This is also the open edge of ADR 0013. While it is true, every frontend
    # still discovers every worker, so a model one of them cannot tokenize still
    # empties that frontend's model list — the blast radius is not yet contained.
    # Narrowing both halves costs a restart of every worker on the cluster; see
    # docs/decisions/0013-*.md before changing it.
    globalDynamoNamespace: true
    # Left empty to take the operator's own defaults.
    resources:
      requests:
        cpu: ""
        memory: ""
      limits:
        memory: ""

  # ── mode: shared ────────────────────────────────────────────────────────
  #
  # Rendered by this chart, in 85-frontend.yaml. Ignored in the other two modes.
  shared:
    image:
      # The Dynamo runtime, which carries the frontend as well as the engines.
      # Keep the tag in step with the `dynamo-platform` dependency in Chart.yaml:
      # this pod speaks to that operator's NATS and registers in its namespace,
      # and Helm does not expose a dependency's version to a template, so the two
      # versions cannot be derived from one another here.
      repository: nvcr.io/nvidia/ai-dynamo/vllm-runtime
      tag: "1.4.1"
      pullPolicy: IfNotPresent

    # Anything else to put on the frontend container, for a flag this chart has
    # not grown a field for. `DYN_*` names are what the frontend reads; `--help`
    # on `python3 -m dynamo.frontend` lists them beside their flags.
    env: {}

    # A router, not a runtime: it holds streams open and copies bytes, and every
    # token of every response passes through it. No CPU limit, for the same
    # reason the agent has none — throttling the data path is latency on every
    # token.
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi

# The pre-tunnel way in, off on every cluster we run. `backend.service` is the
# Dynamo frontend Service, whose name is not knowable until a deployment exists —
# so leave this disabled, or let the plane render it from ClusterServing.url.
serving:
  enabled: false
  host: ""
  clusterIssuer: ""
  entryPoints:
    - websecure
  backend:
    service: ""
    # Empty means the workload namespace.
    namespace: ""
    port: 8000

# ── Telemetry ─────────────────────────────────────────────────────────────────

# Off by default: the write URL has no safe default. Turning it on needs
# `cluster.region` and `remoteWrite.url`, and no credential — the credential is
# the enrolment token above. Left off, the operator can still read DCGM for device
# identity but every metrics panel for this cluster is empty, which reads as an
# idle fleet rather than as a missing pipe.
# What it installs and why it is a direct push: templates/70-metrics-agent.yaml.
monitoring:
  enabled: false

  remoteWrite:
    # Required when enabled; there is no default, because writing a fleet's
    # telemetry to a guessed endpoint is worse than not writing it.
    # e.g. https://metrics.example.com/api/v1/write
    url: ""
    timeout: 30s
    # Sized for a burst after a network blip, not for steady state: at 15s scrapes
    # the queue is near-empty, and the shards drain a backlog faster than it grew.
    queue:
      capacity: 10000
      maxShards: 20
      maxSamplesPerSend: 2000
    # Anything unmatched is dropped at the sender — an unfiltered remote_write from
    # a GPU cluster is mostly per-request histogram cardinality. `node_*`, `kube_*`
    # and `container_*` match nothing today (this chart ships no node-exporter and
    # no kube-state-metrics) and stay listed so adding either needs no write-path
    # change. Carried over verbatim from the stack this replaced, so the central
    # store's series set keeps its shape.
    keep: "DCGM_FI_.*|node_.*|kube_pod_.*|kube_node_.*|kube_deployment_.*|container_(cpu|memory)_.*|vllm:.*|dynamo_.*|up|kubelet_volume_stats_.*"
    # The default needs nothing set: the username is `cluster.id` and the password
    # is the enrolment Secret, whose bcrypt verifier the plane published to the
    # write ingress when it minted the token (ADR 0012). The token therefore
    # appears once in a values file and a second copy cannot drift from it, so
    # `username`/`password` are unread while this is true.
    #
    # `useEnrolmentToken: false` is for a store that is not hangar's: the chart
    # creates the Secret from `username`/`password` instead, with `existing: true`
    # the further opt-out for one you made yourself. Never commit a credential.
    basicAuth:
      useEnrolmentToken: true
      existingSecret: hangar-metrics-remote-write
      usernameKey: username
      passwordKey: password
      username: ""
      password: ""
      existing: false

  agent:
    image:
      repository: quay.io/prometheus/prometheus
      # Agent mode is `--agent` from 3.0 on; on 2.x it was
      # `--enable-feature=agent`. Pinned to the 3.5 LTS line.
      tag: v3.5.5
      pullPolicy: IfNotPresent
    scrapeInterval: 15s
    # Must be <= scrapeInterval, the same trap the exporter's ServiceMonitor has.
    scrapeTimeout: 10s
    # A send buffer, not storage: it holds only what is unacknowledged, so a
    # restart costs the unsent tail and a PVC here would buy nothing.
    walSizeLimit: 4Gi
    # Empty on purpose: GPU nodes carry a taint this pod does not tolerate, so the
    # default placement already keeps it off the expensive hardware.
    nodeSelector: {}
    tolerations: []
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi

# ── Third-party model pulls ───────────────────────────────────────────────────

# Gated models and pull rate limits, in the workload namespace. `value` is
# required when `create` is true; an empty one is a Secret that looks configured
# and fails on the first gated pull.
hfToken:
  create: false
  secretName: hf-token-secret
  value: ""

# ── Subcharts ─────────────────────────────────────────────────────────────────

# A DaemonSet on GPU nodes. Both the toleration and the selector are load-bearing:
# with the toleration alone this lands on every node, and an exporter on a CPU node
# has no GPU to read — the operator then discovers a target set that does not match
# the hardware, which is the missing-devices and phantom-`fell_off_bus` failure. So
# an empty selector is a data-integrity bug, not wasted scheduling.
#
# `nvidia.com/gpu.present` and not `pools.gpuValue`: a subchart's values cannot be
# templated from the parent's, so keying off the pool would name the same nodes
# twice in one file and let the copies drift. This label is identical on every
# cluster.
#
# serviceMonitor needs CRDs this chart does not install, and turning it on with
# `monitoring.enabled` is refused — it would either fail to apply or double-scrape.
# Enable it only for a cluster running its own kube-prometheus-stack.
dcgm-exporter:
  enabled: true
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
  serviceMonitor:
    enabled: false
    interval: 15s
    # Must be <= interval; 15s/25s is a pair Prometheus Operator silently rejects.
    scrapeTimeout: 10s
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

# The Dynamo operator + NATS, the bus Dynamo's Frontend and workers use for
# request/response and KV-cache events; the hangar operator never touches it. NATS
# must be turned on explicitly — 1.4.x defaults `global.nats.install` to false, and
# without it Dynamo's deployments have nothing to route over. etcd and KAI stay off
# at their subchart defaults; component discovery is the Kubernetes API.
#
# Grove is the leader-worker backend a multi-node replica renders onto, and it is
# written out here rather than left at its default because the two keys are not the
# same question and the names do not say so. `install` bundles NVIDIA's Grove
# subchart and deploys the Grove operator cluster-wide; `enabled` only tells the
# Dynamo operator it may emit PodCliqueSets, and is implied by `install`. A cluster
# that got Grove from somewhere else — an NVIDIA install, a platform team, a
# separate release — sets `enabled` alone and leaves `install` false, or it gets two
# Grove operators reconciling the same CRDs.
#
# Both default off, which is what every cluster in the fleet is already running.
# Turning `install` on is a cluster-wide change: it adds CRDs, a controller
# deployment and three admission webhooks that intercept `grove.io` objects, so it
# is a deliberate act on a cluster meant to serve a model too large for one node,
# not a default. NVIDIA's own note is that production installs are recommended to
# install Grove separately rather than through this subchart — the bundled copy is
# pinned to the platform chart's version and upgrades only when it does, which for
# an alpha controller is the wrong coupling. Take the bundle to get a cluster
# serving multi-node today; move to a separate release when the cluster matters.
#
# The hangar operator needs neither key. It discovers the backend by reading the API
# groups the cluster serves and matching `grove` — Grove serves `grove.io` and
# `scheduler.grove.io` — so the capability appears on the next observation tick after
# the CRDs land, whatever this file says. These keys install the thing; `multinode.enabled`
# above only overrides the reading.
#
# `podMonitors.enabled` is pinned false rather than left `null`, and the pin is why
# this cluster's serving metrics are reachable at all. Null means auto-detect: the
# subchart renders its PodMonitors only if the monitoring.coreos.com CRDs exist AT
# INSTALL TIME, so whether a cluster has Dynamo metrics depends on the order two
# unrelated charts were installed in — and the failure is a clean install emitting
# no `vllm:` series. That is the trap that took the fleet dark. Pinned off it
# cannot fire either way: the metrics agent scrapes Dynamo's pods from its own
# config, so these objects are never needed, and a cluster that later grows the
# CRDs for some other reason will not start double-scraping every worker.
dynamo-platform:
  enabled: true
  global:
    nats:
      install: true
    grove:
      install: false
      enabled: false
  dynamo-operator:
    dynamo:
      metrics:
        podMonitors:
          enabled: false
    controllerManager:
      manager:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
  nats:
    config:
      cluster:
        enabled: false
      jetstream:
        enabled: true
        fileStore:
          enabled: true
          pvc:
            enabled: true
            size: 10Gi
