# cluster-setup — everything a cluster installs to become one the plane can manage.
#
# This file is a form. Each value says what to put and what breaks if it is wrong;
# the reasoning behind a component lives in its template's header, and the
# reasoning behind a decision lives in docs/decisions. What is left here is only
# what differs per cluster.

# ── Identity ──────────────────────────────────────────────────────────────────

cluster:
  # Must match the name of a cluster already declared in the plane.
  id: ""
  # The plane's hub endpoint the operator dials, ws:// or wss://.
  hubUrl: ""
  # e.g. ap-south-1. Stamped on every series as the `region` external label, so a
  # cluster that omits it is the one blank cell in a fleet-wide breakdown.
  # Required with `monitoring.enabled`, ignored otherwise.
  region: ""
  readOnly: true
  allowedOperations: benchmark
  logLevel: info
  logFormat: json

# This cluster's identity, and the only credential it needs. Three things verify
# the same string: the operator against the hub, the agent on the tunnel, and the
# metrics agent as remote-write basic auth. The register screen mints it and
# renders it as `value`, and the chart creates the Secret.
enrolmentToken:
  existingSecret: hangar-operator
  secretKey: enrolment-token
  value: ""
  # Opt-out for a hand-driven install where you created `existingSecret` yourself.
  existing: false

# Registry credential for the two images this chart owns, the operator and the
# agent. `name` empty means no pull secret is referenced at all, which is right
# when those images are public or sit in a registry the nodes already authenticate
# to. Set `name` to reference one, and `create` to have the chart build it from
# `username` and `token` — a GHCR token needs only `read:packages`.
#
# Not applied to the metrics agent or the subcharts: they pull from quay.io,
# nvcr.io and Docker Hub, and the subcharts carry their own pull-secret values.
imagePullSecret:
  create: false
  name: ""
  registry: ghcr.io
  username: ""
  token: ""

# ── What this cluster's hardware looks like ───────────────────────────────────

# All three are required. The operator's own default label key is not the one any
# cluster here uses, so an empty value discovers no pools rather than falling back
# usefully, and a `cacheValue` naming a pool that does not exist leaves prefetch
# jobs Pending.
pools:
  labelKey: ""
  gpuValue: ""
  cacheValue: ""
  cacheTaintKey: ""

modelCache:
  create: true
  pvcName: model-cache
  # Required, and must be ReadWriteMany — a cluster's default class is usually RWO
  # and breaks the shared mount. e.g. an EFS-backed class.
  storageClass: ""
  accessMode: ReadWriteMany
  size: 500Gi

dcgm:
  # Empty derives both from the bundled dcgm-exporter. Set them to point at an
  # exporter this chart does not install.
  endpoint: ""
  # How the operator finds the exporter pods behind that Service, so it scrapes
  # every node rather than whichever one the ClusterIP picks.
  selector: ""
  timeout: 5s

# ── What this chart runs ──────────────────────────────────────────────────────

operator:
  image:
    repository: ghcr.io/hangar-dev/operator
    tag: ""
    pullPolicy: Always
  leaderElection: true
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

# This cluster's end of the inference tunnel: dials out to the gateway, proxies
# each request to the local Dynamo frontend. Off by default — the gateway address
# has no safe default, and an agent without one dials nothing.
# Why it is its own Deployment and not a sidecar: templates/80-agent.yaml.
agent:
  enabled: false
  # Two, so a `helm upgrade` does not take this cluster's inference with it.
  replicas: 2
  image:
    repository: ghcr.io/hangar-dev/agent
    tag: ""
    pullPolicy: Always
  gateway:
    # The gateway's tunnel address as `host:port` — TLS assumed, no scheme. One
    # address however many replicas the gateway runs: the agent learns the rest
    # from the handshake, so scaling it never edits this file.
    # e.g. hangar.example.com:443
    address: ""
  # `host:port` or a URL. Empty discovers the Service carrying Dynamo's frontend
  # labels; set it only if this cluster fronts its models with something else.
  frontendEndpoint: ""
  # A proxy, not a runtime: it copies bytes and holds streams open. No CPU limit,
  # because throttling the data path is latency on every token.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# The one OpenAI-compatible frontend every model on this cluster is served
# through. The agent forwards to it, so serving needs it — but it is off by
# default because of an ordering constraint that cannot be worked around here:
# it renders a DynamoGraphDeployment, and that CRD is applied by the Dynamo
# operator at runtime rather than shipped in this chart's `crds/`. Turn it on in a
# SECOND `helm upgrade`, after the first install has the Dynamo operator running;
# enabling it on a fresh cluster fails the release with "no matches for kind
# DynamoGraphDeployment".
# Why it belongs to the cluster and not to a deployment: templates/85-frontend.yaml.
frontend:
  enabled: false
  # Two, so a `helm upgrade` does not take this cluster's inference with it. It
  # holds no model state — the workers do — so a replica is cheap and stateless.
  replicas: 2
  image:
    # The Dynamo runtime, which carries the frontend as well as the engines.
    # Keep the tag in step with the `dynamo-platform` dependency in Chart.yaml:
    # this pod speaks to that operator's NATS and registers in its namespace, and
    # Helm does not expose a dependency's version to a template, so the two
    # versions cannot be derived from one another here.
    repository: nvcr.io/nvidia/ai-dynamo/vllm-runtime
    tag: "1.4.1"
    pullPolicy: IfNotPresent
  # A router, not a runtime: it holds streams open and copies bytes, and every
  # token of every response passes through it. No CPU limit, for the same reason
  # the agent has none — throttling the data path is latency on every token.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi

# The pre-tunnel way in, off on every cluster we run. `backend.service` is the
# Dynamo frontend Service, whose name is not knowable until a deployment exists —
# so leave this disabled, or let the plane render it from ClusterServing.url.
serving:
  enabled: false
  host: ""
  clusterIssuer: ""
  entryPoints:
    - websecure
  backend:
    service: ""
    namespace: dynamo
    port: 8000

# ── Telemetry ─────────────────────────────────────────────────────────────────

# Off by default: the write URL has no safe default. Turning it on needs
# `cluster.region` and `remoteWrite.url`, and no credential — the credential is
# the enrolment token above. Left off, the operator can still read DCGM for device
# identity but every metrics panel for this cluster is empty, which reads as an
# idle fleet rather than as a missing pipe.
# What it installs and why it is a direct push: templates/70-metrics-agent.yaml.
monitoring:
  enabled: false

  remoteWrite:
    # Required when enabled; there is no default, because writing a fleet's
    # telemetry to a guessed endpoint is worse than not writing it.
    # e.g. https://metrics.example.com/api/v1/write
    url: ""
    timeout: 30s
    # Sized for a burst after a network blip, not for steady state: at 15s scrapes
    # the queue is near-empty, and the shards drain a backlog faster than it grew.
    queue:
      capacity: 10000
      maxShards: 20
      maxSamplesPerSend: 2000
    # Anything unmatched is dropped at the sender — an unfiltered remote_write from
    # a GPU cluster is mostly per-request histogram cardinality. `node_*`, `kube_*`
    # and `container_*` match nothing today (this chart ships no node-exporter and
    # no kube-state-metrics) and stay listed so adding either needs no write-path
    # change. Carried over verbatim from the stack this replaced, so the central
    # store's series set keeps its shape.
    keep: "DCGM_FI_.*|node_.*|kube_pod_.*|kube_node_.*|kube_deployment_.*|container_(cpu|memory)_.*|vllm:.*|dynamo_.*|up|kubelet_volume_stats_.*"
    # The default needs nothing set: the username is `cluster.id` and the password
    # is the enrolment Secret, whose bcrypt verifier the plane published to the
    # write ingress when it minted the token (ADR 0012). The token therefore
    # appears once in a values file and a second copy cannot drift from it, so
    # `username`/`password` are unread while this is true.
    #
    # `useEnrolmentToken: false` is for a store that is not hangar's: the chart
    # creates the Secret from `username`/`password` instead, with `existing: true`
    # the further opt-out for one you made yourself. Never commit a credential.
    basicAuth:
      useEnrolmentToken: true
      existingSecret: hangar-metrics-remote-write
      usernameKey: username
      passwordKey: password
      username: ""
      password: ""
      existing: false

  agent:
    image:
      repository: quay.io/prometheus/prometheus
      # Agent mode is `--agent` from 3.0 on; on 2.x it was
      # `--enable-feature=agent`. Pinned to the 3.5 LTS line.
      tag: v3.5.5
      pullPolicy: IfNotPresent
    scrapeInterval: 15s
    # Must be <= scrapeInterval, the same trap the exporter's ServiceMonitor has.
    scrapeTimeout: 10s
    # A send buffer, not storage: it holds only what is unacknowledged, so a
    # restart costs the unsent tail and a PVC here would buy nothing.
    walSizeLimit: 4Gi
    # Empty on purpose: GPU nodes carry a taint this pod does not tolerate, so the
    # default placement already keeps it off the expensive hardware.
    nodeSelector: {}
    tolerations: []
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi

# ── Third-party model pulls ───────────────────────────────────────────────────

# Gated models and pull rate limits, in the `dynamo` namespace. `value` is
# required when `create` is true; an empty one is a Secret that looks configured
# and fails on the first gated pull.
hfToken:
  create: false
  secretName: hf-token-secret
  value: ""

# ── Subcharts ─────────────────────────────────────────────────────────────────

# A DaemonSet on GPU nodes. Both the toleration and the selector are load-bearing:
# with the toleration alone this lands on every node, and an exporter on a CPU node
# has no GPU to read — the operator then discovers a target set that does not match
# the hardware, which is the missing-devices and phantom-`fell_off_bus` failure. So
# an empty selector is a data-integrity bug, not wasted scheduling.
#
# `nvidia.com/gpu.present` and not `pools.gpuValue`: a subchart's values cannot be
# templated from the parent's, so keying off the pool would name the same nodes
# twice in one file and let the copies drift. This label is identical on every
# cluster.
#
# serviceMonitor needs CRDs this chart does not install, and turning it on with
# `monitoring.enabled` is refused — it would either fail to apply or double-scrape.
# Enable it only for a cluster running its own kube-prometheus-stack.
dcgm-exporter:
  enabled: true
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
  serviceMonitor:
    enabled: false
    interval: 15s
    # Must be <= interval; 15s/25s is a pair Prometheus Operator silently rejects.
    scrapeTimeout: 10s
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

# The Dynamo operator + NATS, the bus Dynamo's Frontend and workers use for
# request/response and KV-cache events; the hangar operator never touches it. NATS
# must be turned on explicitly — 1.4.x defaults `global.nats.install` to false, and
# without it Dynamo's deployments have nothing to route over. etcd, Grove and KAI
# stay off at their subchart defaults; component discovery is the Kubernetes API.
#
# `podMonitors.enabled` is pinned false rather than left `null`, and the pin is why
# this cluster's serving metrics are reachable at all. Null means auto-detect: the
# subchart renders its PodMonitors only if the monitoring.coreos.com CRDs exist AT
# INSTALL TIME, so whether a cluster has Dynamo metrics depends on the order two
# unrelated charts were installed in — and the failure is a clean install emitting
# no `vllm:` series. That is the trap that took the fleet dark. Pinned off it
# cannot fire either way: the metrics agent scrapes Dynamo's pods from its own
# config, so these objects are never needed, and a cluster that later grows the
# CRDs for some other reason will not start double-scraping every worker.
dynamo-platform:
  enabled: true
  global:
    nats:
      install: true
  dynamo-operator:
    dynamo:
      metrics:
        podMonitors:
          enabled: false
    controllerManager:
      manager:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
  nats:
    config:
      cluster:
        enabled: false
      jetstream:
        enabled: true
        fileStore:
          enabled: true
          pvc:
            enabled: true
            size: 10Gi
