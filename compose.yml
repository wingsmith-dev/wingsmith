name: hangar

# The plane, as processes something else supervises.
#
# api and hub are the same image with a different argument, and they are here rather than
# backgrounded next to a shell because a process nothing owns outlives the code it was built from:
# a migration lands, the running process keeps the old models in memory, and the endpoints touching
# the changed tables 500 while everything beside them stays green. Rebuilding is how you restart,
# so the two cannot drift apart.
#
# The console is deliberately absent. It wants a dev server with hot reload against a file tree,
# which is a worse thing inside a container than outside one — `just dev` runs it beside this.
# The image does bake a console bundle (see libs/plane/Dockerfile), but the source mount below
# shadows the directory it lands in, so the api here serves the API alone and 404s on `/`. That is
# the intended local shape: the dev server owns the console, and the deployed image owns both.

x-plane: &plane
  build:
    context: ./libs
    dockerfile: plane/Dockerfile
  # The source is mounted over what the image baked, so an edit is a reload rather than a rebuild.
  # The image still owns the virtualenv at /opt/venv, which is why this is a mount of ./app and not
  # of the whole context: shadowing the installed dependencies with a host directory that has none
  # is how this trick usually breaks. A dependency change is still a rebuild.
  # The contract table is mounted for the same reason the source is: it is data the plane reads at
  # runtime and the contract is where it is edited. Baked in, a new device class means a rebuild
  # before the local plane can place against it — and the failure is quiet, because an unknown class
  # slugifies rather than erroring, so the fleet looks fine and the catalog is a generation behind.
  volumes: &plane-source
    - ./libs/plane/app:/app/app:ro
    - ./libs/plane/migrations:/app/migrations:ro
    - ./libs/packages/contract:/app/contract:ro
  environment: &plane-env
    HANGAR_DATABASE_URL: postgresql+psycopg://hangar:hangar@db:5442/hangar
    # Overrides the image's baked-in `production`. This file is the local stack, and `local` is
    # what makes the admin password and the session secret optional — see config/settings.py.
    HANGAR_APP_ENV: local
    # `local` binds loopback by default, which inside a container is unreachable. The ports below
    # are published on the host's loopback only, so this does not put the API on the network.
    HANGAR_API_HOST: 0.0.0.0
    HANGAR_APP_LOG_FORMAT: console
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hangar
      POSTGRES_PASSWORD: hangar
      POSTGRES_DB: hangar
      PGPORT: "5442"
    ports:
      - "127.0.0.1:5442:5442"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hangar -d hangar -p 5442"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Runs to completion before either process starts, which is the whole point of it being a
  # service rather than a step someone remembers. `service_completed_successfully` means a failed
  # migration stops the stack instead of leaving an api to discover it one query at a time.
  migrate:
    build:
      context: ./libs
      dockerfile: plane/Dockerfile
    command: ["migrate", "upgrade", "head"]
    # The same mounts as api and hub, and this is the service that most needs them. Without one,
    # migrate only ever sees the revisions baked at image-build time: a migration written since is
    # invisible to it, so the moment the database is stamped at a revision the image has never heard
    # of — which is what happens the first time anyone runs `alembic upgrade` from the host — this
    # job fails with `Can't locate revision` and takes api and hub down with it as a dependency.
    volumes: *plane-source
    environment:
      <<: *plane-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *plane
    command: ["api", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health")
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # No --reload: the hub holds long-lived operator sessions and there is nothing to reload into
  # that would not drop them. `docker compose restart hub` picks up an edit, and dropping a session
  # deliberately is different from a file watcher doing it whenever a file is saved.
  hub:
    <<: *plane
    command: ["hub"]
    ports:
      - "127.0.0.1:8001:8001"

volumes:
  db_data:
